spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/word_of_the_day
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  telegram:
    bot:
      username: BeataWordOfTheDayBot
      token: ${TELEGRAM_BOT_TOKEN}
      admin-id: ${TELEGRAM_BOT_ADMIN_ID}